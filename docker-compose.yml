services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-context-os-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_context_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_context_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
