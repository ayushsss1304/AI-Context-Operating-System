services:
  - type: web
    name: ai-context-operating-system
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: false
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: DEFAULT_LLM_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        fromDatabase:
          name: ai-context-os-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false

databases:
  - name: ai-context-os-db
    databaseName: ai_context_os
    user: ai_context_os_user
